<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Cyan to Blue Gradient -->
    <linearGradient id="fav-cyan-blue" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#0047FF" />
    </linearGradient>

    <!-- Purple to Magenta Gradient -->
    <linearGradient id="fav-purple-magenta" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7000FF" />
      <stop offset="100%" stop-color="#FF00D6" />
    </linearGradient>

    <!-- Neon Boundary Outer Glow Ring (Cyan to Magenta) -->
    <linearGradient id="fav-glow-border" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="50%" stop-color="#7000FF" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#FF00D6" />
    </linearGradient>
  </defs>

  <!-- Dark Deep Space Blue/Black circular base -->
  <circle cx="64" cy="64" r="61" fill="#030308" stroke="url(#fav-glow-border)" stroke-width="3" />

  <!-- The MORPHMYWEB Iconic 'M' Emblem, optimized for 16x16 and 48x48 punchy legibility -->
  <g transform="translate(64, 60) scale(0.53) translate(-175, -145)">
    <!-- Cyan-Blue Front Helix/Stem Ribbon -->
    <path
      d="M105 215 L105 85 L205 185"
      stroke="url(#fav-cyan-blue)"
      stroke-width="27"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Purple-Magenta Intertwining Backdrop Ribbon -->
    <path
      d="M145 185 L245 85 L245 215"
      stroke="url(#fav-purple-magenta)"
      stroke-width="27"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Interactive HTML/Code Bracket Accent ' </>' -->
    <g transform="translate(175, 208)">
      <!-- Left Anchor Bracket -->
      <path d="M-10 -5 L-17 0 L-10 5" stroke="#00F0FF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
      <!-- Right Anchor Bracket -->
      <path d="M10 -5 L17 0 L10 5" stroke="#00F0FF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
      <!-- Code Slash Line -->
      <path d="M-3 7 L3 -7" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
    </g>

    <!-- Coding Pixel Explosion particles dispersing on the top-right branch for tech vibe -->
    <rect x="248" y="75" width="12" height="12" fill="#B000FF" />
    <rect x="264" y="60" width="14" height="14" fill="#FF00D6" />
    <rect x="282" y="76" width="10" height="10" fill="#0077FF" />
    <rect x="260" y="44" width="9" height="9" fill="#00F0FF" />
  </g>
</svg>
